#Gradle
org.gradle.jvmargs=-Xmx3g

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

#IOS
xcodeproj=./ios

#Configurable kotlin versions
kotlin_version=2.0.20-dev-1749
kotlin_repo_url=
kotlin_api_version=2.0
kotlin_language_version=2.0

#Compose versions
composeMpp.version=1.6.2
# keep empty, by default we use org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable:{kotlin-version}
compose.compiler=
#compose.compiler=1.5.4-dev1-kt2.0.0-Beta1
# or full id is valid too:
#compose.compiler=org.jetbrains.compose.compiler:compiler:1.5.4-dev1-kt2.0.0-Beta1
compose.compiler.customRepositoryUrl=

#Versions
agp.version=7.3.0
sqldelight.version=2.0.0

# Kotlin/Native Experimental Memory Model
kotlin.native.binary.memoryModel=experimental

kotlin.native.cocoapods.generate.wrapper=true
kotlin.native.useEmbeddableCompilerJar=true